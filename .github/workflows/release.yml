name: Release

# 触发方式：
#   - 推送 v* 标签：自动构建并发布到 GitHub Release
#   - PR / 手动 Run workflow：只做交叉编译验证，上传 artifact，不发布
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: udp-over-tcp

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # 只要这三个架构：x64 / aarch64 / armv7。
          # 全部静态链接 musl，产物拷到任意 Linux（含 OpenWrt、老旧 glibc 的设备）即可直接跑。
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
          - target: armv7-unknown-linux-musleabihf
          # 想换成 glibc 动态链接（体积小一点，但依赖目标机 libc 版本）时，
          # 把上面三行替换成下面这三行，其余配置不用动：
          # - target: x86_64-unknown-linux-gnu
          # - target: aarch64-unknown-linux-gnu
          # - target: armv7-unknown-linux-gnueabihf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & target dir
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # cross 用 Docker 容器提供目标架构的 sysroot + 交叉链接器，
      # GitHub 托管的 Ubuntu runner 自带 Docker，无需额外配置。
      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Show versions
        run: |
          rustc --version
          cross --version

      - name: Build
        env:
          # 链接时去掉符号表，产物体积通常能小 60%~80%
          RUSTFLAGS: -C strip=symbols
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "${version}" = "${GITHUB_REF_NAME}" ] && version="${GITHUB_SHA::7}"
          pkg="${BIN_NAME}-v${version}-${{ matrix.target }}"
          mkdir -p "${pkg}"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "${pkg}/"
          cp README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "${pkg}/"
          tar -czf "${pkg}.tar.gz" "${pkg}"
          sha256sum "${pkg}.tar.gz" | tee "${pkg}.tar.gz.sha256"
          echo "PKG=${pkg}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: |
            ${{ env.PKG }}.tar.gz
            ${{ env.PKG }}.tar.gz.sha256
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            ${{ env.PKG }}.tar.gz
            ${{ env.PKG }}.tar.gz.sha256
